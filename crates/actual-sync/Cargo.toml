[package]
name = "actual-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
actual-core = { path = "../actual-core" }
prost = "0.13"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }

[build-dependencies]
prost-build = "0.13"
