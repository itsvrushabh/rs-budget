[package]
name = "actual-sync"
description = "CRDT wire protocol, Protobuf codecs, HLC clock, and Radix Merkle trie for rs-budget"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
actual-core = { path = "../actual-core", version = "0.1.0" }
prost = "0.13"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }

[build-dependencies]
prost-build = "0.13"
