[package]
name = "actual-sync"
description = "CRDT wire protocol, Protobuf codecs, HLC clock, and Radix Merkle trie for rs-budget"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
actual-core = { path = "../actual-core", version = "0.1.0" }
actual-crypto = { path = "../actual-crypto", version = "0.1.0" }
base64 = "0.22"
prost = "0.13"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "2.10", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.6", features = ["v4", "js"] }

[build-dependencies]
prost-build = "0.13"
