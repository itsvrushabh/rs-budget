[package]
name = "actual-import"
description = "Financial statement parsers (QIF, OFX, CSV) and transaction deduplication for rs-budget"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
actual-core = { path = "../actual-core", version = "0.1.0" }
actual-crypto = { path = "../actual-crypto", version = "0.1.0" }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
csv = "1.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
ureq = { version = "2.10", features = ["json"] }
base64 = "0.22"
