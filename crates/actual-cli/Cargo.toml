[package]
name = "actual-cli"
description = "Command-line interface for rs-budget"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "actual"
path = "src/main.rs"

[dependencies]
actual-core = { path = "../actual-core", version = "0.1.0" }
actual-storage = { path = "../actual-storage", version = "0.1.0" }
actual-api = { path = "../actual-api", version = "0.1.0" }
actual-import = { path = "../actual-import", version = "0.1.0" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4"] }
thiserror = "1.0"
