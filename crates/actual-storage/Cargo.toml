[package]
name = "actual-storage"
description = "SQLite persistence, WAL management, and database migrations for rs-budget"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
actual-core = { path = "../actual-core", version = "0.1.0" }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
