[package]
name = "actual-tui"
description = "Interactive terminal user interface for rs-budget built with Ratatui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[[bin]]
name = "actual-tui"
path = "src/main.rs"

[dependencies]
actual-core = { path = "../actual-core", version = "0.1.0" }
actual-api = { path = "../actual-api", version = "0.1.0" }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.4", features = ["derive"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "local-offset"] }
uuid = { version = "1.6", features = ["v4"] }
