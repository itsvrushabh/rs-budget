# Production Docker Compose for rs-budget (100% Rust Actual Budget Server)
# https://github.com/itsvrushabh/rs-budget

services:
  actual-server:
    image: ghcr.io/itsvrushabh/rs-budget-server:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: actual-server
    restart: unless-stopped
    ports:
      - "${ACTUAL_PORT:-5006}:5006"
    environment:
      - PORT=5006
      - HOST=0.0.0.0
      - ACTUAL_DATA_DIR=/data
      - ACTUAL_SERVER_PASSWORD=${ACTUAL_SERVER_PASSWORD:-}
      - ACTUAL_WEB_DIR=${ACTUAL_WEB_DIR:-/app/web}
    volumes:
      - actual-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5006/account/needs-bootstrap || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  actual-data:
    name: actual-data
