name: Release Pipeline

on:
  push:
    branches:
      - release
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run build and packaging without publishing to crates.io or GitHub Releases'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-before-release:
    name: Run Workspace Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cargo Test
        run: cargo test --workspace

  publish-cargo-crates:
    name: Publish Crates to Crates.io
    needs: test-before-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Workspace Crates in Topological Order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set. Skipping crates.io publish."
            exit 0
          fi

          CRATES=(
            "actual-crypto"
            "actual-storage"
            "actual-sync"
            "actual-core"
            "actual-import"
            "actual-api"
            "actual-server"
            "actual-cli"
            "actual-tui"
            "actual-gui"
          )

          for crate in "${CRATES[@]}"; do
            echo "Publishing $crate to crates.io..."
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN" || echo "Warning: Failed to publish $crate, continuing..."
            echo "Sleeping 20 seconds to allow crates.io index propagation..."
            sleep 20
          done

  build-binaries:
    name: Build Binaries (${{ matrix.target }})
    needs: test-before-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: rs-budget-linux-x86_64
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: rs-budget-macos-x86_64
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: rs-budget-macos-aarch64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: rs-budget-windows-x86_64
            archive: zip
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CLI & TUI Release Binaries
        run: cargo build --release --target ${{ matrix.target }} --bin actual --bin actual-tui

      - name: Package Release Archives (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czvf "dist/${{ matrix.asset_name }}.tar.gz" -C "target/${{ matrix.target }}/release" actual actual-tui
          cd dist
          sha256sum "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"

      - name: Package Release Archives (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "target/${{ matrix.target }}/release/actual.exe", "target/${{ matrix.target }}/release/actual-tui.exe" -DestinationPath "dist/${{ matrix.asset_name }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.asset_name }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}.zip" | Out-File -Encoding utf8 "dist/${{ matrix.asset_name }}.zip.sha256"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

  build-mobile-packages:
    name: Build Mobile Packages (Android APK & iOS IPA)
    needs: test-before-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Package Mobile Artifacts
        run: |
          ./scripts/package-mobile.sh all

      - name: Upload Mobile Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rs-budget-mobile
          path: dist/mobile/*

  create-github-release:
    name: Create GitHub Release & Upload Assets
    needs: [build-binaries, build-mobile-packages]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Release Assets:"
          ls -la release-assets

          # Idempotently upload assets if release already exists, or create a new release
          gh release upload "${{ github.ref_name }}" release-assets/* --clobber || \
            gh release create "${{ github.ref_name }}" release-assets/* \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes
