name: Release Pipeline

on:
  push:
    branches:
      - release
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  check-and-publish-cargo:
    name: Publish Cargo Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Publish
        run: |
          if [ -f Cargo.toml ]; then
            echo "Publishing workspace crates to crates.io with CARGO_REGISTRY_TOKEN..."
            cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          else
            echo "Cargo workspace not yet initialized. Skipping publishing step."
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-container:
    name: Build & Push Web Server Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Server Image
        run: |
          if [ -f Dockerfile ]; then
            echo "Building Docker container for actual-server..."
            docker build -t ghcr.io/${{ github.repository }}/actual-server:${{ github.ref_name }} .
          else
            echo "Dockerfile not yet created. Skipping container build step."
          fi
