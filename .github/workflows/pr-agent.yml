name: PR Agent (Gemini)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    name: PR Agent Code Review
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/')) }}
    steps:
      - name: PR Agent Action
        uses: the-pr-agent/pr-agent@main
        env:
          CONFIG.model: "gemini/gemini-1.5-flash"
          CONFIG.fallback_models: '["gemini/gemini-1.5-pro"]'
          CONFIG.custom_model_max_tokens: 32000
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          pr_reviewer.enable_intro_text: "true"
          pr_reviewer.require_focused_review: "true"
