plugins {
    id 'com.android.application'
}

android {
    namespace 'org.actualbudget.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'org.actualbudget.mobile'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
