<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Envelope Body -->
  <rect x="96" y="160" width="320" height="224" rx="20" fill="url(#envelopeGrad)" filter="url(#shadow)"/>

  <!-- Envelope Flap (Open / Folded Lines) -->
  <path d="M 96 176 L 256 296 L 416 176" fill="none" stroke="#94A3B8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 96 374 L 210 270" fill="none" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
  <path d="M 416 374 L 302 270" fill="none" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>

  <!-- Budget Coin / Seal -->
  <circle cx="256" cy="272" r="48" fill="#10B981" filter="url(#shadow)"/>
  <text x="256" y="288" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle">$</text>
</svg>
