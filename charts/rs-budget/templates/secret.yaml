{{- if and (not .Values.existingSecret) .Values.serverPassword -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rs-budget.fullname" . }}-secret
  labels:
    {{- include "rs-budget.labels" . | nindent 4 }}
type: Opaque
stringData:
  ACTUAL_SERVER_PASSWORD: {{ .Values.serverPassword | quote }}
{{- end }}
