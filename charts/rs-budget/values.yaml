# Default values for rs-budget Helm chart

replicaCount: 1

image:
  repository: ghcr.io/itsvrushabh/rs-budget-server
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 5006
  targetPort: 5006

ingress:
  enabled: false
  className: ""
  annotations:
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: budget.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: actual-budget-tls
  #    hosts:
  #      - budget.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /account/needs-bootstrap
    port: 5006
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /account/needs-bootstrap
    port: 5006
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 2

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  annotations: {}

env:
  PORT: "5006"
  HOST: "0.0.0.0"
  ACTUAL_DATA_DIR: "/data"
  ACTUAL_WEB_DIR: "/app/web"
  RUST_LOG: "actual_server=info,tower_http=info"

# Existing secret for server password (optional)
existingSecret: ""
serverPassword: ""

nodeSelector: {}
tolerations: []
affinity: {}
