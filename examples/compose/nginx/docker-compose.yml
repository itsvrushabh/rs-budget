services:
  actual-server:
    image: ghcr.io/itsvrushabh/rs-budget-server:latest
    container_name: actual-server
    restart: unless-stopped
    environment:
      - PORT=5006
      - HOST=0.0.0.0
      - ACTUAL_DATA_DIR=/data
      - ACTUAL_WEB_DIR=/app/web
    volumes:
      - actual-data:/data
    networks:
      - budget-net

  nginx:
    image: nginx:alpine
    container_name: actual-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - budget-net
    depends_on:
      - actual-server

volumes:
  actual-data:

networks:
  budget-net:
    driver: bridge
