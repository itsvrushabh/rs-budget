services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certificates:/letsencrypt"
    networks:
      - budget-net

  actual-server:
    image: ghcr.io/itsvrushabh/rs-budget-server:latest
    container_name: actual-server
    restart: unless-stopped
    environment:
      - PORT=5006
      - HOST=0.0.0.0
      - ACTUAL_DATA_DIR=/data
      - ACTUAL_WEB_DIR=/app/web
    volumes:
      - actual-data:/data
    networks:
      - budget-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.actual.rule=Host(`${BUDGET_DOMAIN:-budget.example.com}`)"
      - "traefik.http.routers.actual.entrypoints=websecure"
      - "traefik.http.routers.actual.tls.certresolver=myresolver"
      - "traefik.http.services.actual.loadbalancer.server.port=5006"

volumes:
  actual-data:
  traefik-certificates:

networks:
  budget-net:
    driver: bridge
